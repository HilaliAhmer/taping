name: TAPING tests

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Syntax check
        run: python -m compileall -q taping scripts/entrypoint.py
      - name: Lint
        run: python -m ruff check taping tests scripts/entrypoint.py
      - name: Tests
        run: python -m pytest -q
